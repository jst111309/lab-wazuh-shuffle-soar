<!--
  Wazuh agent — endpoint-2 / Web Server (10.20.0.12)
  Skenario: 3. file integrity, 4. malware detection, 5. privilege escalation
-->
<ossec_config>
  <client>
    <server>
      <address>10.20.0.10</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>debian, debian12</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>10.20.0.10</manager_address>
      <agent_name>endpoint-2</agent_name>
      <groups>default</groups>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Modul berat dimatikan (hemat RAM, tidak dipakai di skenario) -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>
  <sca>
    <enabled>no</enabled>
  </sca>

  <!-- Inventaris sistem untuk dashboard -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>no</packages>
    <ports all="no">yes</ports>
    <processes>no</processes>
  </wodle>

  <!-- File Integrity Monitoring (mode realtime; whodata butuh auditd yang tidak bisa jalan di container) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Skenario 3: halaman website (deteksi defacement), simpan isi perubahan -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/var/www/html</directories>

    <!-- Skenario 4: folder upload, cek hash SHA256 untuk dicocokkan dengan daftar malware -->
    <directories realtime="yes" check_all="yes">/var/www/uploads</directories>

    <!-- Skenario 3 & 5: file akun & hak akses -->
    <directories realtime="yes" check_all="yes" report_changes="yes"
                 restrict="passwd$|shadow$|group$|sudoers">/etc</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/sudoers.d</directories>
    <nodiff>/etc/shadow</nodiff>
  </syscheck>

  <!-- Skenario 5: penggunaan sudo / su -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Log web server -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>

  <!-- Log hasil active response (untuk tahap Verify) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <active-response>
    <disabled>no</disabled>
    <ca_store>etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
