<!--
  Wazuh agent — endpoint-1 (10.20.0.11)
  Skenario: 1. SSH brute force, 2. unauthorized login, 6. port scanning
-->
<ossec_config>
  <client>
    <server>
      <address>10.20.0.10</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, ubuntu22, ubuntu22.04</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>10.20.0.10</manager_address>
      <agent_name>endpoint-1</agent_name>
      <groups>default</groups>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Modul berat dimatikan (hemat RAM, tidak dipakai di skenario) -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>
  <sca>
    <enabled>no</enabled>
  </sca>

  <!-- Inventaris sistem untuk dashboard -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>no</packages>
    <ports all="no">yes</ports>
    <processes>no</processes>
  </wodle>

  <!-- FIM minimal (fokus FIM ada di endpoint-2): konfigurasi SSH -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/ssh</directories>
  </syscheck>

  <!-- Log SSH: skenario 1 (brute force) & 2 (unauthorized login) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Alert Suricata: skenario 6 (port scanning) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- Log hasil active response (untuk tahap Verify) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <active-response>
    <disabled>no</disabled>
    <ca_store>etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
